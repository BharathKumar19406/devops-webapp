name: VLE3 CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check files
        run: |
          echo "Checking project files..."
          ls -la

      - name: Validate HTML
        run: |
          test -f index.html
          echo "HTML file exists"

      - name: Build
        run: |
          echo "Build completed successfully"

      - name: Finish
        run: |
          echo "CI pipeline completed"
